version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  target-branch: main
  reviewers:
    - jas88
    - jfriel
  groups:
    aws-sdk:
      patterns:
        - "AWSSDK.*"
  ignore:
    # SixLabors.ImageSharp 4.x requires a commercial license key at build time
    - dependency-name: "SixLabors.ImageSharp"
      versions: [">=4.0.0"]
- package-ecosystem: "dotnet-sdk"
  directory: "/"
  schedule:
    interval: weekly
