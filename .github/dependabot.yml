version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  target-branch: main
  reviewers:
    - jas88
    - jfriel
  groups:
    aws-sdk:
      patterns:
        - "AWSSDK.*"
  ignore:
    # Vendored NPOI (externals/npoi) targets the 2025.x BigDecimal API; 3000+ is a
    # rewrite (SignifigantDigits renamed, default Precision 5000 -> 100). Follow
    # nissl-lab/npoi's own pin; revisit when an npoi-update-check PR moves it.
    - dependency-name: "ExtendedNumerics.BigDecimal"
      versions: [">=3000.0.0"]
- package-ecosystem: "dotnet-sdk"
  directory: "/"
  schedule:
    interval: weekly
