version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  target-branch: main
  reviewers:
    - jas88
    - jfriel
  groups:
    aws-sdk:
      patterns:
        - "AWSSDK.*"
  ignore:
    # Vendored NPOI (externals/npoi) targets the 2025.x BigDecimal API; 3000+ is a
    # rewrite (SignifigantDigits renamed, default Precision 5000 -> 100). Follow
    # nissl-lab/npoi's own pin; revisit when an npoi-update-check PR moves it.
    - dependency-name: "ExtendedNumerics.BigDecimal"
      versions: [">=3000.0.0"]
    # Terminal.Gui 2.x is a ground-up API redesign (231 unique compile errors
    # across the 29-file console GUI); v1.19.0 is the latest v1 and has no known
    # advisories. Migration to v2 is a dedicated effort - see tracking issue.
    - dependency-name: "Terminal.Gui"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "dotnet-sdk"
  directory: "/"
  schedule:
    interval: weekly
